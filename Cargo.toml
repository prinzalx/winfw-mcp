[package]
name = "winfw-mcp"
version = "0.50.0"
edition = "2024"
description = "Portable, web-driven Windows Firewall (WFP) controller with an MCP interface"
license = "MIT"
publish = false
rust-version = "1.88"

# Kept deliberately small: the HTTP server is `std` only (PLAN.md section 6). The `/mcp` endpoint
# was weighed against the `rmcp` crate and hand-written instead: four method names are not worth a
# tokio runtime and an axum dependency (src/mcp.rs).
[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fwpm* lives in NetworkManagement::WindowsFilteringPlatform, not in WinSock. FwpmEngineOpen0 is
# additionally gated on System_Rpc because of its credentials parameter, and the filter structs
# only implement Default when the security module is present.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # RegisterClassW and the window class struct are gated behind the GDI module.
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    # QueryDosDeviceW and GetLogicalDrives, for the drive-to-device path mapping.
    "Win32_Storage_FileSystem",
    "Win32_System_Rpc",
    # GetCurrentThreadId, for the message posted to the tray thread when it is asked to stop, and
    # GetModuleHandleW for the window class.
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # Shell_NotifyIconW for the tray icon, and the window message loop that receives its clicks.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"
