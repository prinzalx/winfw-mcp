[package]
name = "winfw-mcp"
version = "0.4.0"
edition = "2024"
description = "Portable, web-driven Windows Firewall (WFP) controller with an MCP interface"
license = "MIT"
publish = false
rust-version = "1.88"

# Kept deliberately small. The HTTP server arrives with milestone 4 and rmcp with milestone 9;
# see PLAN.md section 7.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fwpm* lives in NetworkManagement::WindowsFilteringPlatform, not in WinSock. FwpmEngineOpen0 is
# additionally gated on System_Rpc because of its credentials parameter, and the filter structs
# only implement Default when the security module is present.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Rpc",
] }
