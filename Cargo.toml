[package]
name = "winfw-mcp"
version = "0.1.0"
edition = "2024"
description = "Portable, web-driven Windows Firewall (WFP) controller with an MCP interface"
license = "MIT"
publish = false
rust-version = "1.88"

# Kept deliberately small. WFP bindings arrive with milestone 2, the HTTP server with
# milestone 4 and rmcp with milestone 9; see PLAN.md section 7.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
