name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Windows only by design: the tool is a WFP controller, so there is nothing to gain from a
    # second operating system here. The runner is elevated, so the WFP test reads real entries
    # instead of reporting access denied.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --all-targets

      # --nocapture so the log shows whether the store was read or the run was skipped, and
      # --test-threads=1 because two tests write to the one live WFP store on the machine: run in
      # parallel they clear each other's filters and the counts no longer add up.
      - run: cargo test -- --nocapture --test-threads=1
