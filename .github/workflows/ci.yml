name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Windows only by design: the tool is a WFP controller, so there is nothing to gain from a
    # second operating system here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --all-targets
      - run: cargo test
